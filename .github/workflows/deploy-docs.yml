# 构建 VitePress 文档站并发布到 GitHub Pages：https://kiler398.github.io/office-preview-kit/
# 文档站从 npm 安装已发布的 office-preview-kit，所以首次部署前需要先发布 npm 包。
# 仓库设置：Settings → Pages → Build and deployment → Source 选择 “GitHub Actions”。
name: Deploy docs

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (office-preview-kit from npm)
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
